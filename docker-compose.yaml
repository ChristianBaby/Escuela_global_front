# =============================================================
# Escuela Global Frontend — docker-compose
# Stack independiente para Coolify. Se conecta al backend por
# la red compartida `lms-net` (la crea el stack del backend).
#
# Comunicacion interna: http://lms-backend:4000 (HTTP plano)
# Comunicacion externa: Traefik (Coolify) -> https://tu-dominio
#
# Local: REQUIERE que el stack de lms-backend este corriendo
# (ver Makefile en la raiz de practicas). Si la red `lms-net`
# no existe, este compose falla al levantar.
# =============================================================

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time. Se embebe en el bundle JS.
        # Por defecto usa el nombre del servicio del backend en el
        # otro stack ("lms-backend") para hablarle por la red interna.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://lms-backend:4000/api}
    image: escuela-global-frontend:latest
    container_name: lms-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # Para serverApi.ts (server-side rendering de Next.js)
      API_URL: ${NEXT_PUBLIC_API_URL:-http://lms-backend:4000/api}
      BACKEND_API_URL: ${NEXT_PUBLIC_API_URL:-http://lms-backend:4000/api}
      # URL interna del backend (usada en rewrites de Next.js para proxy /api y /uploads)
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://lms-backend:4000}
    networks:
      - lms-net
    ports:
      - "3000:3000"

# =============================================================
# Red compartida con el stack del backend.
# La red la CREA el stack del backend (lms-backend/docker-compose.yml).
# Acá la declaramos como `external: true` para unirse.
# =============================================================
networks:
  lms-net:
    name: lms-net
    external: true
